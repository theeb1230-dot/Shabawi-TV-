name: KickStream Restreamer

on:
  repository_dispatch:
    types: [start_stream]

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # أقل من حد الـ 6 ساعات بهامش أمان

    steps:
      - name: 🔔 Notify Telegram - Stream Starting
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "🟢 *البث بدأ!*\n\n📡 المصدر: `${{ github.event.client_payload.source_url }}`\n🎯 الوجهة: Kick.com\n🕐 الوقت: '"$(date '+%Y-%m-%d %H:%M:%S UTC')"'\n\n_Run ID: ${{ github.run_id }}_",
              "parse_mode": "Markdown"
            }'

      - name: 📦 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: 🎬 Start Restream with Auto-Retry
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          KICK_RTMP_URL: rtmps://fa723fc1b171.global-contribute.live-video.net/app
          KICK_STREAM_KEY: ${{ secrets.KICK_STREAM_KEY }}
          MAX_RETRIES: 3
          RETRY_DELAY: 10
        run: |
          RETRY=0
          EXIT_CODE=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "▶️ محاولة رقم $((RETRY + 1)) من $MAX_RETRIES"
            echo "📡 المصدر: $SOURCE_URL"

            # تشغيل FFmpeg مع stream copy لأداء أفضل
            ffmpeg \
              -re \
              -i "$SOURCE_URL" \
              -c:v copy \
              -c:a copy \
              -f flv \
              -loglevel warning \
              "$KICK_RTMP_URL/$KICK_STREAM_KEY"

            EXIT_CODE=$?
            echo "⚠️ FFmpeg توقف بكود: $EXIT_CODE"

            RETRY=$((RETRY + 1))

            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "⏳ إعادة المحاولة بعد $RETRY_DELAY ثانية..."
              sleep $RETRY_DELAY
            fi
          done

          # فشلت كل المحاولات
          echo "❌ فشلت جميع المحاولات ($MAX_RETRIES). إيقاف البث."
          exit 1

      - name: 🔴 Notify Telegram - Stream Failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "🔴 *البث توقف!*\n\n❌ فشلت جميع محاولات إعادة الاتصال\n📡 المصدر: `${{ github.event.client_payload.source_url }}`\n🕐 الوقت: '"$(date '+%Y-%m-%d %H:%M:%S UTC')"'\n\n_Run ID: ${{ github.run_id }}_",
              "parse_mode": "Markdown"
            }'

      - name: ✅ Notify Telegram - Stream Ended Normally
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "✅ *البث انتهى بنجاح*\n\n🕐 الوقت: '"$(date '+%Y-%m-%d %H:%M:%S UTC')"'\n\n_Run ID: ${{ github.run_id }}_",
              "parse_mode": "Markdown"
            }'
